name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "*"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-26:
    runs-on: macos-26
    strategy:
      matrix:
        xcode:
          - "27.0"
          - "27.1"
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode ${{ matrix.xcode }}
        run: sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app
      - name: Print Swift version
        run: swift --version
      - name: Install Simulator Runtimes
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 15
          max_attempts: 3
          command: xcodebuild -downloadAllPlatforms
      - name: Run ${{ matrix.config }} tests
        run: CONFIG=${{ matrix.config }} make test-all

  linux:
    name: Linux
    runs-on: ubuntu-latest
    strategy:
      matrix:
        config: ["debug", "release"]
        swift:
          - "6.4"
    container: swift:${{ matrix.swift }}
    steps:
      - uses: actions/checkout@v5
      - name: Run tests
        run: swift test -c ${{ matrix.config }}

  wasm:
    name: Wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: bytecodealliance/actions/wasmtime/setup@v1
      - name: Install Swift and Swift SDK for WebAssembly
        run: |
          PREFIX=/opt/swift
          set -ex
          curl -f -o /tmp/swift.tar.gz "https://download.swift.org/swift-6.4.0-release/ubuntu2204/swift-6.4.0-RELEASE/swift-6.4.0-RELEASE-ubuntu22.04.tar.gz"
          sudo mkdir -p $PREFIX; sudo tar -xzf /tmp/swift.tar.gz -C $PREFIX --strip-component 1
          $PREFIX/usr/bin/swift sdk install https://download.swift.org/swift-6.4.0-release/wasm-sdk/swift-6.4.0-RELEASE/swift-6.4.0-RELEASE_wasm.artifactbundle.tar.gz --checksum f07b7be3c586d92d7a07051fc6d303b87ebea67eadc40640ba59d5a8b79aa86d
          echo "$PREFIX/usr/bin" >> $GITHUB_PATH

      - name: Build
        run: swift build --swift-sdk swift-6.4.0-RELEASE_wasm -Xlinker -z -Xlinker stack-size=$((1024 * 1024))
